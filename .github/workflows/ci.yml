name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify

  frontend:
    name: Frontend (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: heimdall-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: heimdall-ui/package-lock.json

      - run: npm ci

      # non-blocking until the existing code is confirmed to type-check cleanly
      # (vite build does not type-check) — remove continue-on-error once it's green
      - name: Type check
        run: npx tsc --noEmit -p .
        continue-on-error: true

      - name: Build
        run: npm run build
