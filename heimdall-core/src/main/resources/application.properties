quarkus.rest.path=/heimdall/api/
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:5173

quarkus.datasource.jdbc.enable-metrics=true

# HEIMDALL CONFIGS
heimdall.scheduler.interval=3s
heimdall.history.limit=60
heimdall.traces.limit=100

# optional ? defaults to intercepting everything
#heimdall.tracing.packages=com.myapp

quarkus.index-dependency.heimdall-docker.group-id=com.fischer
quarkus.index-dependency.heimdall-docker.artifact-id=heimdall-docker