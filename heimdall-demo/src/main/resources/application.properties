# Heimdall demo — a host application embedding Heimdall.
# Dashboard: http://localhost:8080/heimdall/     Swagger UI: http://localhost:8080/q/swagger-ui

# the Vite dev server (heimdall-ui, port 5173) calls the API cross-origin
%dev.quarkus.http.cors=true
%dev.quarkus.http.cors.origins=http://localhost:5173

# keep Heimdall's own endpoints out of the demo's OpenAPI document
mp.openapi.scan.exclude.packages=com.fischer.heimdall

# --- Heimdall settings (all optional, defaults shown) ---------------------------------
#heimdall.scheduler.interval=3s
#heimdall.history.limit=60
#heimdall.traces.limit=100
#heimdall.threaddump.max-depth=100
#heimdall.threaddump.history-limit=10
# per-method stats (beans page): methods averaging above this many ms show as slow
#heimdall.monitor.slow-threshold=500
# restrict method tracing to these packages (comma-separated); by default classes
# annotated with @HeimdallMonitor whose name ends in Resource/Controller/Service/Repository/Dao
#heimdall.tracing.packages=com.example.demo
